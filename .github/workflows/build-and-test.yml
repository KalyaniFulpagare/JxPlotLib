name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        # Stops at the "test" phase (compile + run tests) rather than "verify",
        # because this project's maven-gpg-plugin is bound to the verify phase
        # and requires a signing key that's intentionally only configured in
        # the separate release workflows, not here.
        run: mvn -B test